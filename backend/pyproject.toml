[project]
name = "backend"
version = "0.1.0"
description = "Company Research Assistant API"
readme = "README.md"
authors = [
    { name = "okunishi", email = "niyutadesign@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]