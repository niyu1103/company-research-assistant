[project]
name = "backend"
version = "0.1.0"
description = "Company Research Assistant API"
readme = "README.md"
authors = [
    { name = "okunishi", email = "niyutadesign@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "databricks-sql-connector>=4.6.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "openai-agents>=0.24.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
